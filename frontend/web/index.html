<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- Google Sign-In for Web: set your OAuth client ID here -->
  <!-- Replace with your Web client ID from Google Cloud Console -->
  <meta name="google-signin-client_id" content="1077633030540-8n5ifbgad4fv3rmsnnenovlnunt6duas.apps.googleusercontent.com">
  <!-- Google platform library used by google_sign_in web implementation -->
  <script src="https://apis.google.com/js/platform.js" async defer></script>
  <!-- Google Identity Services Library for getting ID Token -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="hookd">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/Icon-192.png"/>
  
  <!-- Web app manifest -->
  <link rel="manifest" href="manifest.json">

  <title>hookd</title>
  <link rel="manifest" href="manifest.json">
  
  <script>
    // Initialize Google Sign-In on page load
    window.addEventListener('load', function() {
      if (typeof google !== 'undefined' && google.accounts) {
        google.accounts.id.initialize({
          client_id: '1077633030540-8n5ifbgad4fv3rmsnnenovlnunt6duas.apps.googleusercontent.com',
          callback: window.handleCredentialResponse
        });
      }
    });

    // Store the ID token globally
    window.googleIdToken = null;

    // Callback handler for Google Sign-In response
    window.handleCredentialResponse = function(response) {
      window.googleIdToken = response.credential;
      console.log('ID token received from Google:', response.credential.substring(0, 50) + '...');
      
      // Notify Flutter that the token is ready
      if (window.flutter_inappwebview) {
        window.flutter_inappwebview.callHandler('idTokenReady', {
          idToken: response.credential
        });
      }
    };

    // Function to get the ID token (called by Flutter)
    window.getGoogleIdToken = function() {
      return window.googleIdToken;
    };

    // Function to sign out
    window.googleSignOut = function() {
      if (typeof google !== 'undefined' && google.accounts) {
        google.accounts.id.disableAutoSelect();
      }
      window.googleIdToken = null;
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
